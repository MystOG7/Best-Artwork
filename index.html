<!--

    78 Artworks | 10 Categories | Lightbox with Zoom & Pan

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✨ My Art Gallery ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root {
            --deep-purple: #1a0b2e;
            --royal-purple: #4a1c6b;
            --violet: #7b2cbf;
            --lavender: #b185db;
            --soft-purple: #d4a5ff;
            --light-purple: #f0e1ff;
            --cream: #faf6ff;
            --gold: #ffd700;
            --rose-gold: #e8b4b8;
            --text-light: #f8f0ff;
            --text-dark: #2d1b4e;
            --card-bg: rgba(255,255,255,0.08);
            --glass: rgba(255,255,255,0.05);
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d021a 0%, #1a0b2e 25%, #2d1b4e 50%, #1a0b2e 75%, #0d021a 100%);
            background-attachment: fixed;
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .bg-particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }
        .particle {
            position: absolute; border-radius: 50%;
            animation: floatParticle var(--duration) infinite ease-in-out;
            opacity: var(--opacity);
            filter: blur(1px);
        }
        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: var(--opacity); }
            25% { transform: translateY(-120px) translateX(60px) scale(1.2); opacity: calc(var(--opacity) * 1.5); }
            50% { transform: translateY(-60px) translateX(-40px) scale(0.8); opacity: calc(var(--opacity) * 0.7); }
            75% { transform: translateY(-180px) translateX(30px) scale(1.1); opacity: calc(var(--opacity) * 1.2); }
        }

        .orb {
            position: fixed; border-radius: 50%;
            filter: blur(80px); pointer-events: none; z-index: 0;
            animation: orbFloat 20s infinite ease-in-out;
        }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.2); }
            66% { transform: translate(-20px, 30px) scale(0.9); }
        }

        header {
            position: relative; z-index: 10; text-align: center;
            padding: 50px 20px 35px;
            background: linear-gradient(180deg, rgba(26,11,46,0.95) 0%, rgba(74,28,107,0.6) 100%);
            overflow: hidden; border-bottom: 1px solid rgba(123,44,191,0.3);
        }
        header::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(123,44,191,0.15) 0%, transparent 60%);
            animation: rotateGlow 25s linear infinite;
        }
        @keyframes rotateGlow {
            from { transform: rotate(0deg); } to { transform: rotate(360deg); }
        }
        .header-content { position: relative; z-index: 2; }
        h1 {
            font-family: 'Playfair Display', serif; font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 800; margin-bottom: 8px; line-height: 1.2;
            background: linear-gradient(135deg, #fff 0%, var(--soft-purple) 30%, var(--gold) 60%, #fff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: 2px;
            animation: shimmer 3s linear infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .subtitle {
            font-size: clamp(0.8rem, 2.5vw, 1.1rem);
            color: var(--lavender); font-weight: 300;
            letter-spacing: 4px; text-transform: uppercase;
        }
        .divider {
            width: 80px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--violet), transparent);
            margin: 18px auto; border-radius: 2px;
            animation: pulseWidth 2s ease-in-out infinite;
        }
        @keyframes pulseWidth {
            0%, 100% { width: 80px; opacity: 0.8; }
            50% { width: 120px; opacity: 1; }
        }
        .art-count {
            font-size: 0.85rem; color: var(--lavender); opacity: 0.8;
            margin-top: 5px;
        }

        .nav-container {
            position: sticky; top: 0; z-index: 100;
            background: rgba(13,2,26,0.92); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 10px; border-bottom: 1px solid rgba(123,44,191,0.2);
            overflow-x: auto; -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .nav-container::-webkit-scrollbar { display: none; }
        .nav-tabs {
            display: flex; gap: 8px; min-width: max-content;
            justify-content: flex-start; padding: 0 5px;
            margin: 0 auto; max-width: 1200px;
        }
        .nav-tab {
            padding: 10px 20px; border: none; background: transparent;
            color: var(--lavender); font-family: 'Poppins', sans-serif;
            font-size: 0.85rem; font-weight: 500; cursor: pointer;
            border-radius: 25px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; overflow: hidden; white-space: nowrap;
            border: 1px solid rgba(123,44,191,0.3);
        }
        .nav-tab::before {
            content: ''; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, var(--royal-purple), var(--violet));
            opacity: 0; transition: opacity 0.4s ease;
            border-radius: 25px; z-index: -1;
        }
        .nav-tab:hover::before, .nav-tab.active::before { opacity: 1; }
        .nav-tab:hover, .nav-tab.active {
            color: white; transform: translateY(-2px) scale(1.05);
            box-shadow: 0 8px 25px rgba(123,44,191,0.4);
            border-color: transparent;
        }
        .nav-tab.active {
            background: linear-gradient(135deg, var(--violet), var(--royal-purple));
            box-shadow: 0 0 20px rgba(123,44,191,0.6), 0 0 40px rgba(123,44,191,0.3);
        }

        main {
            position: relative; z-index: 5;
            max-width: 1400px; margin: 0 auto; padding: 30px 15px;
        }
        .category-section {
            display: none;
        }
        .category-section.active { display: block; animation: fadeInUp 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .category-title {
            font-family: 'Playfair Display', serif; font-size: clamp(1.6rem, 5vw, 2.2rem);
            color: var(--soft-purple); text-align: center; margin-bottom: 8px;
            position: relative; display: inline-block;
            left: 50%; transform: translateX(-50%);
            text-shadow: 0 0 30px rgba(123,44,191,0.5);
        }
        .category-title::after {
            content: ''; position: absolute; bottom: -10px; left: 50%;
            transform: translateX(-50%); width: 50px; height: 3px;
            background: linear-gradient(90deg, var(--gold), var(--violet), var(--gold));
            border-radius: 2px; animation: glowLine 2s ease-in-out infinite;
        }
        @keyframes glowLine {
            0%, 100% { box-shadow: 0 0 5px var(--violet); width: 50px; }
            50% { box-shadow: 0 0 15px var(--gold), 0 0 30px var(--violet); width: 80px; }
        }
        .category-desc {
            text-align: center; color: var(--lavender); font-size: 0.9rem;
            margin-bottom: 35px; margin-top: 18px; font-style: italic; opacity: 0.9;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px; padding: 15px 0;
        }
        @media (max-width: 768px) {
            .gallery-grid { grid-template-columns: 1fr; gap: 20px; }
        }
        @media (min-width: 769px) and (max-width: 1024px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .art-card {
            background: linear-gradient(145deg, rgba(74,28,107,0.4), rgba(26,11,46,0.6));
            border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3), 0 0 0 1px rgba(123,44,191,0.2);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer; position: relative;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .art-card:hover, .art-card:active {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 60px rgba(123,44,191,0.3), 0 0 0 1px rgba(123,44,191,0.4);
        }
        .art-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(123,44,191,0.3) 100%);
            opacity: 0; transition: opacity 0.4s ease; z-index: 2; border-radius: 20px;
            pointer-events: none;
        }
        .art-card:hover::before { opacity: 1; }
        .art-image-container {
            position: relative; overflow: hidden;
            background: linear-gradient(135deg, rgba(74,28,107,0.3) 0%, rgba(26,11,46,0.5) 100%);
            display: flex; align-items: center; justify-content: center;
            aspect-ratio: 4/5;
        }
        .art-image {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .art-card:hover .art-image { transform: scale(1.12); }
        .img-error {
            display: none; flex-direction: column; align-items: center;
            justify-content: center; color: var(--lavender); font-size: 0.85rem; text-align: center;
            padding: 20px;
        }
        .img-error .icon { font-size: 3rem; margin-bottom: 10px; opacity: 0.6; }
        .art-image.error + .img-error {
            display: flex; position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(26,11,46,0.9);
        }
        .expand-icon {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 55px; height: 55px;
            background: rgba(123,44,191,0.9); backdrop-filter: blur(10px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            z-index: 3; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 20px rgba(123,44,191,0.5), 0 0 30px rgba(123,44,191,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .expand-icon svg { width: 24px; height: 24px; color: white; }
        .art-card:hover .expand-icon { transform: translate(-50%, -50%) scale(1); }
        .art-info {
            padding: 20px 22px 22px;
            background: linear-gradient(180deg, rgba(74,28,107,0.2), rgba(26,11,46,0.4));
            position: relative; border-top: 1px solid rgba(123,44,191,0.2);
        }
        .art-info::before {
            content: '"'; position: absolute; top: -25px; right: 15px;
            font-family: 'Playfair Display', serif; font-size: 4.5rem;
            color: var(--violet); opacity: 0.25; line-height: 1;
        }
        .art-title {
            font-family: 'Playfair Display', serif; font-size: 1.15rem;
            color: var(--soft-purple); margin-bottom: 8px; font-weight: 600;
            line-height: 1.3;
        }
        .art-praise {
            font-size: 0.85rem; color: var(--lavender); line-height: 1.6; font-style: italic;
        }
        .art-praise .heart {
            color: #ff6b9d; display: inline-block;
            animation: heartbeat 1.5s ease infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); }
        }
        .category-tag {
            display: inline-block; padding: 3px 10px; border-radius: 12px;
            font-size: 0.7rem; font-weight: 500; margin-top: 10px;
            background: rgba(123,44,191,0.3); color: var(--soft-purple);
            border: 1px solid rgba(123,44,191,0.4);
        }

        .lightbox {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(13,2,26,0.98);
            z-index: 1000; justify-content: center; align-items: center;
            flex-direction: column; animation: fadeIn 0.3s ease;
            backdrop-filter: blur(20px);
            overflow: hidden;
        }
        .lightbox.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .lightbox-img-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }
        .lightbox-img-wrapper:active {
            cursor: grabbing;
        }
        .lightbox-img-wrapper.is-zoomed {
            cursor: grab;
        }
        .lightbox-img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: center center;
            user-select: none;
            -webkit-user-drag: none;
        }
        .lightbox-img.zoomed {
            max-width: none;
            max-height: none;
            transition: none;
        }
        .lightbox-img.error { display: none; }

        .lightbox-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 1002;
            background: rgba(26,11,46,0.8);
            backdrop-filter: blur(20px);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(123,44,191,0.4);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .lightbox.active .lightbox-controls {
            opacity: 1;
        }
        .lightbox-controls:hover {
            opacity: 1 !important;
        }
        .lb-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(123,44,191,0.5);
            background: rgba(123,44,191,0.2);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .lb-btn:hover {
            background: rgba(123,44,191,0.5);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(123,44,191,0.4);
        }
        .lb-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }
        .lb-zoom-level {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            color: var(--lavender);
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
        }

        .lightbox-error {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--lavender); font-size: 1.2rem; text-align: center;
            z-index: 1001;
        }
        .lightbox-error.active { display: flex; }
        .lightbox-error .icon { font-size: 4rem; margin-bottom: 15px; }

        .lightbox-close {
            position: absolute; top: 20px; right: 20px;
            width: 48px; height: 48px; background: rgba(123,44,191,0.3);
            border: 2px solid rgba(123,44,191,0.5); border-radius: 50%;
            color: white; font-size: 1.4rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; z-index: 1001; backdrop-filter: blur(10px);
        }
        .lightbox-close:hover {
            background: rgba(123,44,191,0.6); transform: rotate(90deg) scale(1.1);
            box-shadow: 0 0 20px rgba(123,44,191,0.5);
        }
        .lightbox-info {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1001;
            background: rgba(26,11,46,0.8);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 15px;
            border: 1px solid rgba(123,44,191,0.3);
            max-width: 300px;
        }
        .lightbox-info h3 {
            font-family: 'Playfair Display', serif;
            color: var(--soft-purple);
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .lightbox-info p {
            color: var(--lavender);
            font-size: 0.8rem;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .lightbox-error {
            display: none; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%); flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--lavender); font-size: 1.2rem; text-align: center;
            z-index: 1001;
        }
        .lightbox-error.active { display: flex; }
        .lightbox-error .icon { font-size: 4rem; margin-bottom: 15px; }

        .lightbox-close { width: 42px; height: 42px; top: 15px; right: 15px; }
            .lightbox-controls { bottom: 20px; padding: 8px 15px; gap: 8px; }
            .lb-btn { width: 38px; height: 38px; font-size: 1rem; }
            .lightbox-info { max-width: 200px; padding: 8px 12px; top: 15px; left: 15px; }
            .lightbox-info h3 { font-size: 0.85rem; }
            .lightbox-info p { font-size: 0.7rem; }
        }

        footer {
            text-align: center; padding: 40px 20px;
            color: var(--lavender); font-size: 0.9rem;
            position: relative; z-index: 5;
            border-top: 1px solid rgba(123,44,191,0.2);
            background: linear-gradient(180deg, transparent, rgba(26,11,46,0.5));
        }
        footer .heart { color: #ff6b9d; display: inline-block; animation: heartbeat 1.5s ease infinite; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--deep-purple); }
        ::-webkit-scrollbar-thumb { background: var(--royal-purple); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--violet); }

        .art-image-container::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 40px; height: 40px; margin: -20px 0 0 -20px;
            border: 3px solid rgba(123,44,191,0.2);
            border-top-color: var(--violet); border-radius: 50%;
            animation: spin 1s linear infinite; opacity: 0;
            transition: opacity 0.3s;
        }
        .art-image-container.loading::after { opacity: 1; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .art-card {
            opacity: 0; transform: translateY(30px);
            animation: cardEnter 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes cardEnter {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <div class="orb" style="width: 300px; height: 300px; background: rgba(123,44,191,0.15); top: 10%; left: -5%; animation-delay: 0s;"></div>
    <div class="orb" style="width: 400px; height: 400px; background: rgba(74,28,107,0.12); bottom: 20%; right: -10%; animation-delay: -7s;"></div>
    <div class="orb" style="width: 250px; height: 250px; background: rgba(177,133,219,0.1); top: 50%; left: 60%; animation-delay: -14s;"></div>

    <header>
        <div class="header-content">
            <h1>✨ My Art Gallery ✨</h1>
            <div class="divider"></div>
            <p class="subtitle">Where Every Stroke Tells a Story</p>
            <p class="art-count">78 Beautiful Artworks • Curated with Love</p>
        </div>
    </header>

    <nav class="nav-container">
        <div class="nav-tabs">
            <button class="nav-tab active" onclick="showCategory('all')">All Artworks</button>
            <button class="nav-tab" onclick="showCategory('calligraphy')">Islamic Calligraphy</button>
            <button class="nav-tab" onclick="showCategory('architecture')">Islamic Architecture</button>
            <button class="nav-tab" onclick="showCategory('awareness')">Awareness Art</button>
            <button class="nav-tab" onclick="showCategory('nature')">Nature & Landscapes</button>
            <button class="nav-tab" onclick="showCategory('journal')">Quranic Journal</button>
            <button class="nav-tab" onclick="showCategory('reminders')">Islamic Reminders</button>
            <button class="nav-tab" onclick="showCategory('portraits')">Portraits & Eyes</button>
            <button class="nav-tab" onclick="showCategory('ramadan')">Ramadan Cards</button>
            <button class="nav-tab" onclick="showCategory('other')">Other Artworks</button>
        </div>
    </nav>

    <main id="gallery-main">
        </main>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" onclick="closeLightbox()">✕</button>
        <div class="lightbox-info" id="lightbox-info">
            <h3 id="lightbox-title"></h3>
            <p id="lightbox-category"></p>
        </div>
        <div class="lightbox-img-wrapper" id="lightbox-wrapper">
            <img src="" alt="" class="lightbox-img" id="lightbox-img" onerror="this.classList.add('error'); document.getElementById('lightbox-error').classList.add('active');">
        </div>
        <div class="lightbox-error" id="lightbox-error">
            <div class="icon">🎨</div>
            <div>Image not found</div>
        </div>
        <div class="lightbox-controls">
            <button class="lb-btn" onclick="zoomOut()" id="zoom-out" title="Zoom Out">−</button>
            <span class="lb-zoom-level" id="zoom-level">100%</span>
            <button class="lb-btn" onclick="zoomIn()" id="zoom-in" title="Zoom In">+</button>
            <button class="lb-btn" onclick="resetZoom()" id="zoom-reset" title="Reset Zoom" style="font-size: 0.8rem;">⟲</button>
            <button class="lb-btn" onclick="prevImage()" title="Previous">←</button>
            <button class="lb-btn" onclick="nextImage()" title="Next">→</button>
        </div>
    </div>

    <footer>
        <p>Made with <span class="heart">❤</span> for beautiful art</p>
        <p style="margin-top: 8px; font-size: 0.8rem; opacity: 0.7;">78 artworks of faith, creativity, and passion</p>
    </footer>

    <script>
        // ==================== ALL 78 ARTWORKS DATA ====================
// ============================================
// GITHUB IMAGE SOURCE CONFIGURATION
// ============================================
// Leave empty if images are in the same folder as this HTML file (GitHub Pages)
const IMAGE_BASE_URL = '';

        // ==================== DYNAMICALLY RENDER GALLERY ====================
        function renderGallery() {
            const main = document.getElementById('gallery-main');

            Object.keys(categoryMap).forEach(catId => {
                const cat = categoryMap[catId];
                const filtered = artworks.filter(cat.filter);

                const section = document.createElement('section');
                section.id = catId;
                section.className = `category-section${catId === 'all' ? ' active' : ''}`;

                section.innerHTML = `
                    <h2 class="category-title">${cat.title}</h2>
                    <p class="category-desc">${cat.desc} — ${filtered.length} artwork${filtered.length !== 1 ? 's' : ''}</p>
                    <div class="gallery-grid">
                        ${filtered.map((art, i) => `
                            <div class="art-card" onclick="openLightbox(${artworks.indexOf(art)})" style="animation-delay: ${i * 0.08}s">
                                <div class="art-image-container loading">
                                    <img src="${IMAGE_BASE_URL}${art.src}" alt="${art.title}" class="art-image" loading="lazy" 
                                        onerror="this.classList.add('error'); this.style.display='none';" 
                                        onload="this.parentElement.classList.remove('loading')">
                                    <div class="img-error"><div class="icon">🎨</div><div>${art.title}</div></div>
                                    <div class="expand-icon">
                                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                                        </svg>
                                    </div>
                                </div>
                                <div class="art-info">
                                    <h3 class="art-title">${art.title}</h3>
                                    <p class="art-praise">${art.praise} <span class="heart">❤</span></p>
                                    <span class="category-tag">${art.category}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                main.appendChild(section);
            });
        }

        // ==================== PARTICLES ====================
        const particlesContainer = document.getElementById('particles');
        const colors = ['#7b2cbf', '#b185db', '#ffd700', '#ff6b9d', '#4a1c6b'];
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 8 + 2;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.background = colors[Math.floor(Math.random() * colors.length)];
            particle.style.left = Math.random() * 100 + '%';
            particle.style.top = Math.random() * 100 + '%';
            particle.style.setProperty('--duration', (12 + Math.random() * 18) + 's');
            particle.style.setProperty('--opacity', (0.2 + Math.random() * 0.4));
            particle.style.animationDelay = Math.random() * 15 + 's';
            particlesContainer.appendChild(particle);
        }

        // ==================== CATEGORY SWITCHING ====================
        function showCategory(category) {
            document.querySelectorAll('.category-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(category).classList.add('active');
            event.target.classList.add('active');

            // Re-trigger card animations
            document.querySelectorAll('.category-section.active .art-card').forEach((card, i) => {
                card.style.animation = 'none';
                card.offsetHeight;
                card.style.animation = `cardEnter 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards`;
                card.style.animationDelay = (i * 0.04) + 's';
            });
        }

        // ==================== LIGHTBOX & ZOOM ====================
        let currentIndex = 0;
        let zoomLevel = 1;
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxWrapper = document.getElementById('lightbox-wrapper');
        const zoomLevelEl = document.getElementById('zoom-level');
        const zoomInBtn = document.getElementById('zoom-in');
        const zoomOutBtn = document.getElementById('zoom-out');

        function updateZoomDisplay() {
            zoomLevelEl.textContent = Math.round(zoomLevel * 100) + '%';
            zoomInBtn.disabled = zoomLevel >= 5;
            zoomOutBtn.disabled = zoomLevel <= 0.5;

            if (zoomLevel > 1) {
                lightboxImg.classList.add('zoomed');
                lightboxWrapper.classList.add('is-zoomed');
            } else {
                lightboxImg.classList.remove('zoomed');
                lightboxWrapper.classList.remove('is-zoomed');
                translateX = 0;
                translateY = 0;
            }

            applyTransform();
        }

        function applyTransform() {
            lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${zoomLevel})`;
        }

        function zoomIn() {
            if (zoomLevel < 5) {
                zoomLevel = Math.min(zoomLevel + 0.5, 5);
                updateZoomDisplay();
            }
        }

        function zoomOut() {
            if (zoomLevel > 0.5) {
                zoomLevel = Math.max(zoomLevel - 0.5, 0.5);
                if (zoomLevel <= 1) {
                    translateX = 0;
                    translateY = 0;
                }
                updateZoomDisplay();
            }
        }

        function resetZoom() {
            zoomLevel = 1;
            translateX = 0;
            translateY = 0;
            updateZoomDisplay();
        }

        function openLightbox(index) {
            currentIndex = index;
            const art = artworks[currentIndex];

            resetZoom();

            lightboxImg.style.animation = 'none';
            lightboxImg.classList.remove('error');
            document.getElementById('lightbox-error').classList.remove('active');
            lightboxImg.style.display = 'block';

            document.getElementById('lightbox-title').textContent = art.title;
            document.getElementById('lightbox-category').textContent = art.category;

            setTimeout(() => {
                lightboxImg.src = IMAGE_BASE_URL + art.src;
                lightboxImg.alt = art.title;
                lightboxImg.style.animation = 'zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
            }, 10);

            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = 'auto';
            setTimeout(() => {
                lightboxImg.src = '';
                resetZoom();
            }, 300);
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + artworks.length) % artworks.length;
            openLightbox(currentIndex);
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % artworks.length;
            openLightbox(currentIndex);
        }

        // ==================== DRAG TO PAN ====================
        lightboxWrapper.addEventListener('mousedown', (e) => {
            if (zoomLevel <= 1) return;
            isDragging = true;
            startX = e.clientX - translateX;
            startY = e.clientY - translateY;
            lightboxWrapper.style.cursor = 'grabbing';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            translateX = e.clientX - startX;
            translateY = e.clientY - startY;
            applyTransform();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            lightboxWrapper.style.cursor = zoomLevel > 1 ? 'grab' : 'default';
        });

        lightboxWrapper.addEventListener('touchstart', (e) => {
            if (zoomLevel <= 1) return;
            isDragging = true;
            startX = e.touches[0].clientX - translateX;
            startY = e.touches[0].clientY - translateY;
        }, { passive: false });

        document.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            translateX = e.touches[0].clientX - startX;
            translateY = e.touches[0].clientY - startY;
            applyTransform();
        }, { passive: false });

        document.addEventListener('touchend', () => {
            isDragging = false;
        });

        lightboxWrapper.addEventListener('dblclick', (e) => {
            e.preventDefault();
            if (zoomLevel > 1) {
                resetZoom();
            } else {
                zoomLevel = 2.5;
                updateZoomDisplay();
            }
        });

        // ==================== KEYBOARD ====================
        document.addEventListener('keydown', function(e) {
            if (!lightbox.classList.contains('active')) return;

            switch(e.key) {
                case 'Escape': closeLightbox(); break;
                case 'ArrowLeft': prevImage(); break;
                case 'ArrowRight': nextImage(); break;
                case '+': case '=': zoomIn(); break;
                case '-': zoomOut(); break;
                case '0': resetZoom(); break;
            }
        });

        lightbox.addEventListener('click', function(e) {
            if (e.target === this || e.target.classList.contains('lightbox-img-wrapper')) {
                closeLightbox();
            }
        });

        lightboxWrapper.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (e.deltaY < 0) {
                zoomIn();
            } else {
                zoomOut();
            }
        }, { passive: false });

        // ==================== INTERSECTION OBSERVER ====================
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, { threshold: 0.1 });

        // ==================== INITIALIZE ====================
        renderGallery();

        document.querySelectorAll('.art-card').forEach(card => {
            observer.observe(card);
        });
    </script>
</body>
</html>
